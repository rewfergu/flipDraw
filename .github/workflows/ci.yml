name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The emulators (database + functions) need a JDK 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          bun install
          bun install --cwd functions

      # src/firebase.config.js is git-ignored; the app uses the local emulators.
      - name: Configure Firebase for the emulators
        run: cp src/firebase.config.example.js src/firebase.config.js

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun test

      - name: Install Firebase CLI
        run: bun add -g firebase-tools

      - name: Database rules tests
        run: bun run test:rules

      - name: Cloud Functions tests
        run: bun run test:functions

      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7
